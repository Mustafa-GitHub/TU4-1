<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 - SVG House &amp; Garden</title>
	<style>
		body {
			margin: 2rem;
			background: #f4f7fb;
			font-family: Arial, sans-serif;
		}

		svg {
			display: block;
			width: min(100%, 800px);
			height: auto;
			border: 3px solid #34495e;
			background: #bfe7ff;
		}

		#scene-annotated-figure #scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
		}

		#scene-annotated-figure #scene-annotated #annotations text,
		#scene-annotated-figure #scene-annotated #annotations line {
			pointer-events: none;
		}

		/* Step 3 styling is scoped to the adjusted scene only. */
		#scene-adjusted .adjusted-house {
			stroke: #512d20;
			stroke-width: 6;
		}

		#scene-adjusted .adjusted-window {
			stroke: #24566b;
			stroke-width: 5;
		}

		#scene-adjusted .adjusted-fence {
			stroke: #ffffff;
			stroke-width: 6;
			stroke-dasharray: 12 8;
		}

		#scene-adjusted .stone-footpath {
			fill: #d6d3c4;
			stroke: #4f5d66;
			stroke-width: 4;
		}

		#scene-adjusted .mailbox {
			fill: #2f6474;
			stroke: #193b47;
			stroke-width: 3;
		}

		#scene-adjusted .smoke {
			fill: #e1e7ea;
			stroke: #87949b;
			stroke-width: 2;
		}
	</style>
</head>
<body>
	<figure id="scene-original">
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
		<title id="scene-title">A house and garden scene</title>
		<desc id="scene-desc">A sunny garden with a blue sky, cloud, tree, fenced yard, house, and curved path.</desc>

		<!-- Sky and grass -->
		<rect x="0" y="0" width="800" height="350" fill="#bfe7ff"></rect>
		<rect x="0" y="350" width="800" height="150" fill="#8bcf70"></rect>

		<!-- Sun and cloud -->
		<circle cx="680" cy="90" r="48" fill="#ffd447" stroke="#e3a91a" stroke-width="4"></circle>
		<ellipse cx="155" cy="105" rx="75" ry="28" fill="#ffffff"></ellipse>
		<circle cx="105" cy="105" r="30" fill="#ffffff"></circle>
		<circle cx="175" cy="92" r="38" fill="#ffffff"></circle>

		<!-- Tree -->
		<rect x="105" y="270" width="34" height="115" fill="#87552f"></rect>
		<circle cx="122" cy="220" r="62" fill="#3f9d50"></circle>
		<circle cx="78" cy="250" r="46" fill="#4eac55"></circle>
		<circle cx="170" cy="252" r="50" fill="#388c48"></circle>

		<!-- House body, roof, and chimney -->
		<rect x="290" y="235" width="275" height="170" fill="#f4c27a" stroke="#6d4027" stroke-width="5"></rect>
		<polygon points="265,240 428,105 590,240" fill="#c95c45" stroke="#6d4027" stroke-width="5"></polygon>
		<rect x="480" y="142" width="42" height="85" fill="#8d5540" stroke="#6d4027" stroke-width="5"></rect>

		<!-- Door and windows -->
		<rect x="395" y="315" width="62" height="90" fill="#68432d" stroke="#4d3022" stroke-width="4"></rect>
		<circle cx="444" cy="360" r="5" fill="#f7d36b"></circle>
		<rect x="320" y="275" width="52" height="48" fill="#8ed8ed" stroke="#4d7080" stroke-width="4"></rect>
		<line x1="346" y1="275" x2="346" y2="323" stroke="#4d7080" stroke-width="4"></line>
		<line x1="320" y1="299" x2="372" y2="299" stroke="#4d7080" stroke-width="4"></line>
		<rect x="485" y="275" width="52" height="48" fill="#8ed8ed" stroke="#4d7080" stroke-width="4"></rect>
		<line x1="511" y1="275" x2="511" y2="323" stroke="#4d7080" stroke-width="4"></line>
		<line x1="485" y1="299" x2="537" y2="299" stroke="#4d7080" stroke-width="4"></line>

		<!-- Fence -->
		<polyline points="25,365 25,315 55,335 85,315 115,335 145,315 175,335 205,315 235,335 235,365" fill="none" stroke="#f4ead1" stroke-width="9" stroke-linejoin="round"></polyline>
		<line x1="25" y1="345" x2="235" y2="345" stroke="#f4ead1" stroke-width="7"></line>

		<!-- Curved garden path -->
		<path d="M 425 405 C 405 430, 355 442, 330 500 L 505 500 C 482 445, 455 425, 442 405 Z" fill="#dfc08c" stroke="#b08a5a" stroke-width="3"></path>

		<text x="400" y="470" text-anchor="middle" fill="#315d35" font-size="22" font-weight="bold">Welcome to the garden</text>
		</svg>
		<figcaption>Original scene</figcaption>
	</figure>

	<figure id="scene-annotated-figure">
		<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
			<title id="scene-title">A house and garden scene</title>
			<desc id="scene-desc">A sunny garden with a blue sky, cloud, tree, fenced yard, house, and curved path.</desc>

			<!-- Sky and grass -->
			<rect x="0" y="0" width="800" height="350" fill="#bfe7ff"></rect>
			<rect x="0" y="350" width="800" height="150" fill="#8bcf70"></rect>

			<!-- Sun and cloud -->
			<circle cx="680" cy="90" r="48" fill="#ffd447" stroke="#e3a91a" stroke-width="4"></circle>
			<ellipse cx="155" cy="105" rx="75" ry="28" fill="#ffffff"></ellipse>
			<circle cx="105" cy="105" r="30" fill="#ffffff"></circle>
			<circle cx="175" cy="92" r="38" fill="#ffffff"></circle>

			<!-- Tree -->
			<rect x="105" y="270" width="34" height="115" fill="#87552f"></rect>
			<circle cx="122" cy="220" r="62" fill="#3f9d50"></circle>
			<circle cx="78" cy="250" r="46" fill="#4eac55"></circle>
			<circle cx="170" cy="252" r="50" fill="#388c48"></circle>

			<!-- House body, roof, and chimney -->
			<rect x="290" y="235" width="275" height="170" fill="#f4c27a" stroke="#6d4027" stroke-width="5"></rect>
			<polygon points="265,240 428,105 590,240" fill="#c95c45" stroke="#6d4027" stroke-width="5"></polygon>
			<rect x="480" y="142" width="42" height="85" fill="#8d5540" stroke="#6d4027" stroke-width="5"></rect>

			<!-- Door and windows -->
			<rect x="395" y="315" width="62" height="90" fill="#68432d" stroke="#4d3022" stroke-width="4"></rect>
			<circle cx="444" cy="360" r="5" fill="#f7d36b"></circle>
			<rect x="320" y="275" width="52" height="48" fill="#8ed8ed" stroke="#4d7080" stroke-width="4"></rect>
			<line x1="346" y1="275" x2="346" y2="323" stroke="#4d7080" stroke-width="4"></line>
			<line x1="320" y1="299" x2="372" y2="299" stroke="#4d7080" stroke-width="4"></line>
			<rect x="485" y="275" width="52" height="48" fill="#8ed8ed" stroke="#4d7080" stroke-width="4"></rect>
			<line x1="511" y1="275" x2="511" y2="323" stroke="#4d7080" stroke-width="4"></line>
			<line x1="485" y1="299" x2="537" y2="299" stroke="#4d7080" stroke-width="4"></line>

			<!-- Fence -->
			<polyline points="25,365 25,315 55,335 85,315 115,335 145,315 175,335 205,315 235,335 235,365" fill="none" stroke="#f4ead1" stroke-width="9" stroke-linejoin="round"></polyline>
			<line x1="25" y1="345" x2="235" y2="345" stroke="#f4ead1" stroke-width="7"></line>

			<!-- Curved garden path -->
			<path d="M 425 405 C 405 430, 355 442, 330 500 L 505 500 C 482 445, 455 425, 442 405 Z" fill="#dfc08c" stroke="#b08a5a" stroke-width="3"></path>

			<text x="400" y="470" text-anchor="middle" fill="#315d35" font-size="22" font-weight="bold">Welcome to the garden</text>

			<g id="annotations">
				<line x1="620" y1="35" x2="680" y2="90"></line>
				<text x="565" y="30">circle (cx=680, cy=90, r=48)</text>

				<line x1="575" y1="285" x2="560" y2="260"></line>
				<text x="575" y="285">rect (x=290, y=235, width=275, height=170)</text>

				<line x1="220" y1="75" x2="190" y2="95"></line>
				<text x="220" y="70">ellipse (cx=155, cy=105, rx=75, ry=28)</text>

				<line x1="260" y1="270" x2="346" y2="275"></line>
				<text x="255" y="265">line (346,275) -&gt; (346,323)</text>

				<line x1="35" y1="390" x2="55" y2="335"></line>
				<text x="30" y="410">polyline (25,365 25,315 55,335)</text>

				<line x1="595" y1="220" x2="550" y2="220"></line>
				<text x="600" y="215">polygon (265,240 428,105 590,240)</text>

				<line x1="535" y1="430" x2="480" y2="450"></line>
				<text x="540" y="425">path (M425 405 C405 430 ... L505 500)</text>

				<line x1="535" y1="475" x2="470" y2="470"></line>
				<text x="540" y="480">text (x=400, y=470)</text>
			</g>
		</svg>
		<figcaption>Annotated scene (Step 2)</figcaption>
	</figure>

	<figure id="scene-adjusted-figure">
		<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="scene-adjusted-title scene-adjusted-desc">
			<title id="scene-adjusted-title">An adjusted house and garden scene</title>
			<desc id="scene-adjusted-desc">A sunny garden with a balanced house and tree, dashed fence, stone footpath, mailbox, and chimney smoke.</desc>

			<!-- Sky and grass remain on the original 800 by 500 coordinate scale. -->
			<rect x="0" y="0" width="800" height="350" fill="#bfe7ff"></rect>
			<rect x="0" y="350" width="800" height="150" fill="#8bcf70"></rect>

			<!-- Sun and cloud keep their original positions. -->
			<circle cx="680" cy="90" r="48" fill="#ffd447" stroke="#e3a91a" stroke-width="4"></circle>
			<ellipse cx="155" cy="105" rx="75" ry="28" fill="#ffffff"></ellipse>
			<circle cx="105" cy="105" r="30" fill="#ffffff"></circle>
			<circle cx="175" cy="92" r="38" fill="#ffffff"></circle>

			<!-- Balance adjustment: move the tree slightly left. -->
			<g transform="translate(-12, 0)">
				<rect x="105" y="270" width="34" height="115" fill="#87552f"></rect>
				<circle cx="122" cy="220" r="62" fill="#3f9d50"></circle>
				<circle cx="78" cy="250" r="46" fill="#4eac55"></circle>
				<circle cx="170" cy="252" r="50" fill="#388c48"></circle>
			</g>

			<!-- Balance adjustment: move the house slightly right and strengthen its outlines. -->
			<g transform="translate(12, 0)">
				<rect class="adjusted-house" x="290" y="235" width="275" height="170" fill="#f4c27a"></rect>
				<polygon class="adjusted-house" points="265,240 428,105 590,240" fill="#c95c45"></polygon>
				<rect class="adjusted-house" x="480" y="142" width="42" height="85" fill="#8d5540"></rect>

				<!-- Door and windows use varied, higher-contrast stroke widths. -->
				<rect class="adjusted-house" x="395" y="315" width="62" height="90" fill="#68432d"></rect>
				<circle cx="444" cy="360" r="5" fill="#f7d36b"></circle>
				<rect class="adjusted-window" x="320" y="275" width="52" height="48" fill="#8ed8ed"></rect>
				<line class="adjusted-window" x1="346" y1="275" x2="346" y2="323"></line>
				<line class="adjusted-window" x1="320" y1="299" x2="372" y2="299"></line>
				<rect class="adjusted-window" x="485" y="275" width="52" height="48" fill="#8ed8ed"></rect>
				<line class="adjusted-window" x1="511" y1="275" x2="511" y2="323"></line>
				<line class="adjusted-window" x1="485" y1="299" x2="537" y2="299"></line>
			</g>

			<!-- Fence adjustment: improve contrast and use a dashed stroke. -->
			<polyline class="adjusted-fence" points="25,365 25,315 55,335 85,315 115,335 145,315 175,335 205,315 235,335 235,365" fill="none" stroke-linejoin="round"></polyline>
			<line class="adjusted-fence" x1="25" y1="345" x2="235" y2="345"></line>

			<!-- Original garden path is retained; the new stone path is added below. -->
			<path d="M 425 405 C 405 430, 355 442, 330 500 L 505 500 C 482 445, 455 425, 442 405 Z" fill="#dfc08c" stroke="#b08a5a" stroke-width="3"></path>

			<!-- New curved stone footpath leads from the shifted door to the foreground. -->
			<path class="stone-footpath" d="M 438 405 C 455 430, 490 455, 525 500 L 455 500 C 455 460, 440 430, 438 405 Z"></path>

			<!-- New mailbox: a post, rectangular box, and peaked top beside the path. -->
			<line class="mailbox" x1="565" y1="390" x2="565" y2="440"></line>
			<rect class="mailbox" x="550" y="365" width="30" height="25" rx="3"></rect>
			<polygon class="mailbox" points="550,365 565,350 580,365"></polygon>

			<!-- New subtle chimney smoke uses small ellipses. -->
			<ellipse class="smoke" cx="513" cy="125" rx="13" ry="8"></ellipse>
			<ellipse class="smoke" cx="525" cy="105" rx="16" ry="10"></ellipse>
			<ellipse class="smoke" cx="515" cy="82" rx="11" ry="7"></ellipse>

			<text x="400" y="470" text-anchor="middle" fill="#315d35" font-size="22" font-weight="bold">Welcome to the garden</text>
		</svg>
		<figcaption>Adjusted scene (Step 3)</figcaption>
	</figure>
</body>
</html>
